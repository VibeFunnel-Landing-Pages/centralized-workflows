name: S3 Deployment

on:
  workflow_call:
    inputs:
      source_dir:
        description: 'Source directory to deploy'
        required: true
        type: string
      dest_dir:
        description: 'Target directory to deploy'
        required: true
        type: string
      delete_flag:
        description: 'When true adds --delete to the non-image sync step'
        required: false
        default: true
        type: boolean
    secrets:
      S3_BUCKET_NAME:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Deploy the branch tip, not the triggering commit: when pushes come in quick succession, a run that
    # finishes last must not mirror (with --delete) an older snapshot over a newer one. No credentials are
    # persisted into .git/config.
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
        persist-credentials: false

    - name: 🔍 Debug AWS env values
      run: |
        echo "AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}"
        echo "AWS_SECRET_ACCESS_KEY: (length ${#AWS_SECRET_ACCESS_KEY})"
        echo "AWS_REGION: ${AWS_REGION}"
        echo "S3_BUCKET_NAME: ${AWS_S3_BUCKET}"
        echo "DEST_DIR: ${DEST_DIR}"
        echo "SOURCE_DIR: ${SOURCE_DIR}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        SOURCE_DIR: ${{ inputs.source_dir }}
        DEST_DIR: ${{ inputs.dest_dir }}

    - name: Sync non-image files (with optional delete)
      run: |
        echo "Syncing non-image content from $SOURCE_DIR to s3://$AWS_S3_BUCKET/$DEST_DIR"
        # Git metadata, CI config and the repository README are never published
        ARGS=(--exclude 'images' --exclude 'images/*' --exclude '.git*' --exclude 'README.md')
        if [ "$DELETE_FLAG" = "true" ]; then
          ARGS+=(--delete)
        fi
        aws s3 sync "$SOURCE_DIR" "s3://$AWS_S3_BUCKET/$DEST_DIR" "${ARGS[@]}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        SOURCE_DIR: ${{ inputs.source_dir }}
        DEST_DIR: ${{ inputs.dest_dir }}
        DELETE_FLAG: ${{ inputs.delete_flag }}

    - name: Remove git metadata published by earlier deploys
      run: |
        # Excluded paths are skipped by --delete, so copies uploaded before they were excluded are removed here
        aws s3 rm "s3://$AWS_S3_BUCKET/$DEST_DIR/.git" --recursive
        aws s3 rm "s3://$AWS_S3_BUCKET/$DEST_DIR/.github" --recursive
        aws s3 rm "s3://$AWS_S3_BUCKET/$DEST_DIR/.gitignore"
        aws s3 rm "s3://$AWS_S3_BUCKET/$DEST_DIR/README.md"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        DEST_DIR: ${{ inputs.dest_dir }}

    - name: Sync images without delete
      run: |
        if [ ! -d "$SOURCE_DIR/images" ]; then
          echo "No images directory found in $SOURCE_DIR; skipping images sync"
          exit 0
        fi

        echo "Syncing images from $SOURCE_DIR/images to s3://$AWS_S3_BUCKET/$DEST_DIR/images"
        aws s3 sync "$SOURCE_DIR/images" "s3://$AWS_S3_BUCKET/$DEST_DIR/images"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        SOURCE_DIR: ${{ inputs.source_dir }}
        DEST_DIR: ${{ inputs.dest_dir }}
